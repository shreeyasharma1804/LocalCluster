# This manifest was generated by flux. DO NOT EDIT.
# GitRepository resource checks the remote git repo every 1m, and if there is a new commit, creates a new artifact.
# It does not apply any changes to the cluster
# A newer artifact generates an event which runs the Kustomization reconciliation
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: flux-system
  url: ssh://git@github.com/shreeyasharma1804/LocalCluster
---
# Applies the new artifact to the cluster
# The kustomize file at ./cluster location is used to create the new manifests at a temporary location
# No git fetch is done, every 10m the latest artifact is deployed to the cluster to avoid  drifts
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./cluster
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
